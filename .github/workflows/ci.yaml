name: CI/CD - Coffee Queue

on:
  push:
    branches:
      - main
      - staging
      - development
  pull_request:
    branches:
      - main
      - development

env:
  REGISTRY: docker.io
  APP_IMAGE_NAME: manny2024/coffeequeue-app
  DB_IMAGE_NAME: manny2024/coffeequeue-db

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests
        run: mvn -B -ntp clean verify
        working-directory: .

  docker-build-push:
    name: Build and push Docker images
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      app_image: ${{ steps.image-tags.outputs.app_image }}
      db_image: ${{ steps.image-tags.outputs.db_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: image-tags
        run: |
          IMAGE_REPO=${{ secrets.DOCKERHUB_USERNAME }}
          APP_IMAGE=${{ env.REGISTRY }}/${IMAGE_REPO}/${{ env.APP_IMAGE_NAME }}
          DB_IMAGE=${{ env.REGISTRY }}/${IMAGE_REPO}/${{ env.DB_IMAGE_NAME }}

          echo "app_image=${APP_IMAGE}:${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "db_image=${DB_IMAGE}:${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./coffeequeue
          file: ./coffeequeue/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tags.outputs.app_image }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_IMAGE_NAME }}:latest

      - name: Build and push db image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./db/Dockerfile
          push: true
          tags: |
            ${{ steps.image-tags.outputs.db_image }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DB_IMAGE_NAME }}:latest

  deploy-kind:
    name: Deploy to local kind cluster
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kind cluster
        uses: helm/kind-action@v1.9.0
        with:
          wait: 120s

      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f kubernetes/postgres-deployment.yaml
          kubectl apply -f kubernetes/postgres-service.yaml

      - name: Deploy application
        run: |
          kubectl apply -f kubernetes/app-deployment.yaml
          kubectl apply -f kubernetes/app-service.yaml
          kubectl apply -f kubernetes/hpa.yaml

      - name: Update images to pushed tags
        run: |
          kubectl set image deployment/coffeequeue-db postgres=${{ needs.docker-build-push.outputs.db_image }}
          kubectl set image deployment/coffeequeue-app coffeequeue-app=${{ needs.docker-build-push.outputs.app_image }}

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/coffeequeue-db --timeout=120s
          kubectl rollout status deployment/coffeequeue-app --timeout=180s

      - name: Show pods
        run: kubectl get pods -o wide