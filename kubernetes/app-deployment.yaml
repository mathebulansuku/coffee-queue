apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffeequeue-app
  labels:
    app: coffeequeue-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: coffeequeue-app
  template:
    metadata:
      labels:
        app: coffeequeue-app
    spec:
      containers:
        - name: coffeequeue-app
          image: coffeequeue-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://coffeequeue-db:5432/coffeequeue
            - name: SPRING_DATASOURCE_USERNAME
              value: coffee_user
            - name: SPRING_DATASOURCE_PASSWORD
              value: coffee_password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
