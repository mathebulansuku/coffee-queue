name: CI/CD - Coffee Queue

on:
  push:
    branches:
      - main
      - staging
      - development
  pull_request:
    branches:
      - main
      - development

env:
  REGISTRY: docker.io
  APP_IMAGE_NAME: coffeequeue-app
  DB_IMAGE_NAME: coffeequeue-db

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests
        run: mvn -B -ntp clean verify
        working-directory: ./coffeequeue